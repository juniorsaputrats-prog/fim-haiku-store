<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hematBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A102E" />
      <stop offset="50%" stop-color="#120A20" />
      <stop offset="100%" stop-color="#080410" />
    </linearGradient>
    <radialGradient id="hematAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hematTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#hematBg)" />

  <g opacity="0.12">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <circle cx="400" cy="220" r="260" fill="url(#hematAura)" />

  <!-- Simple Survival Minecraft Environment -->
  <g transform="translate(400, 310)">
    <!-- Base Platform (Dirt / Wood Tier) -->
    <polygon points="0,80 230,0 0,-80 -230,0" fill="#2E1065" stroke="#7C3AED" stroke-width="2" />
    <polygon points="-230,0 0,80 0,125 -230,45" fill="#170933" />
    <polygon points="0,80 230,0 230,45 0,125" fill="#1F0D45" />

    <!-- Cozy Spawn Cottage / Small Spawn Keep -->
    <g transform="translate(0, -60)">
      <polygon points="-60,-15 60,-15 60,60 -60,60" fill="#1E293B" stroke="#334155" stroke-width="2" />
      <!-- Oak / Spruce Wood Roof -->
      <polygon points="0,-75 75,-15 -75,-15" fill="#78350F" stroke="#92400E" stroke-width="2" />
      <!-- Glowing Doorway -->
      <rect x="-14" y="10" width="28" height="50" rx="3" fill="#FBBF24" />
    </g>

    <!-- Minecraft Crafting Table & Chest -->
    <g transform="translate(-120, -10)">
      <polygon points="0,-18 20,-8 0,2 -20,-8" fill="#B45309" stroke="#D97706" stroke-width="1.5" />
      <polygon points="-20,-8 0,2 0,22 -20,12" fill="#78350F" />
      <polygon points="0,2 20,-8 20,12 0,22" fill="#92400E" />
    </g>
    <!-- End Crystal on Right -->
    <g transform="translate(120, -10)">
      <polygon points="0,-22 18,-10 0,2 -18,-10" fill="#C084FC" stroke="#DDD6FE" stroke-width="1.5" />
      <polygon points="-18,-10 0,2 0,26 -18,14" fill="#9333EA" />
      <polygon points="0,2 18,-10 18,14 0,26" fill="#6B21A8" />
      <circle cx="0" cy="2" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Big Typography Title -->
  <g transform="translate(400, 75)" text-anchor="middle">
    <text x="0" y="5" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="#000000" opacity="0.8">
      PAKET HEMAT FIMOO
    </text>
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="url(#hematTitle)" stroke="#3B0764" stroke-width="3">
      PAKET HEMAT FIMOO
    </text>

    <!-- Subtitle Banner Tag -->
    <rect x="-160" y="18" width="320" height="30" rx="15" fill="#1E1B4B" stroke="#7C3AED" stroke-width="1.5" />
    <text x="0" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#E9D5FF">
      STARTER SERVER &amp; 5 PLUGINS
    </text>
  </g>

  <!-- Floating Feature Badges -->
  <g transform="translate(40, 390)">
    <rect width="170" height="36" rx="8" fill="#181926" stroke="#7C3AED" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#10B981" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Konfigurasi Dasar Rapi</text>
  </g>
  <g transform="translate(590, 390)">
    <rect width="170" height="36" rx="8" fill="#181926" stroke="#7C3AED" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#8B5CF6" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Instalasi Max 5 Plugin</text>
  </g>
</svg>
