<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%" fill="none">
  <!-- Dark Telemetry Base -->
  <rect width="420" height="220" rx="8" fill="#0d1117" />
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="44" x2="420" y2="44" stroke="#1c2331" stroke-width="0.8" />
  <line x1="0" y1="88" x2="420" y2="88" stroke="#1c2331" stroke-width="0.8" />
  <line x1="0" y1="132" x2="420" y2="132" stroke="#1c2331" stroke-width="0.8" />
  <line x1="0" y1="176" x2="420" y2="176" stroke="#1c2331" stroke-width="0.8" />

  <!-- Top Metrics Bar -->
  <g transform="translate(24, 18)">
    <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#4b5568">
      TELEMETRY // AUDIENCE CONVERSION &amp; RETENTION
    </text>

    <!-- Stat 1 -->
    <rect x="0" y="24" width="118" height="42" rx="4" fill="#131924" stroke="#253043" stroke-width="1" />
    <text x="10" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7d8799">UNIQUE REACH</text>
    <text x="10" y="56" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#ffffff">5,400+ Gamer</text>

    <!-- Stat 2 -->
    <rect x="126" y="24" width="118" height="42" rx="4" fill="#131924" stroke="#253043" stroke-width="1" />
    <text x="136" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7d8799">DISCORD INFLUX</text>
    <text x="136" y="56" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">+120 Join / hr</text>

    <!-- Stat 3 -->
    <rect x="252" y="24" width="118" height="42" rx="4" fill="#131924" stroke="#253043" stroke-width="1" />
    <text x="262" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7d8799">CONVERSION</text>
    <text x="262" y="56" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#a78bfa">High Organic</text>
  </g>

  <!-- Player Trend Chart Line -->
  <g transform="translate(24, 100)">
    <rect width="372" height="100" rx="6" fill="#111622" stroke="#1e2636" stroke-width="1" />
    
    <!-- Chart Grid -->
    <line x1="20" y1="25" x2="352" y2="25" stroke="#1c2536" stroke-width="0.7" stroke-dasharray="2 2" />
    <line x1="20" y1="50" x2="352" y2="50" stroke="#1c2536" stroke-width="0.7" stroke-dasharray="2 2" />
    <line x1="20" y1="75" x2="352" y2="75" stroke="#1c2536" stroke-width="0.7" stroke-dasharray="2 2" />

    <!-- Trend Area Fill -->
    <polygon points="20,80 70,68 130,72 190,45 250,50 310,22 352,18 352,90 20,90" fill="#38bdf8" fill-opacity="0.08" />
    <!-- Trend Line -->
    <polyline points="20,80 70,68 130,72 190,45 250,50 310,22 352,18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pulse Point at Peak -->
    <circle cx="352" cy="18" r="4" fill="#38bdf8" />
    <circle cx="352" cy="18" r="7" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    
    <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#38bdf8">
      ▲ PLAYER TRAFFIC PEAK (RELEASE CAMPAIGN)
    </text>
  </g>
</svg>
