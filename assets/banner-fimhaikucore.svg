<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="editorBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141522" />
      <stop offset="50%" stop-color="#0E0F18" />
      <stop offset="100%" stop-color="#08080E" />
    </linearGradient>

    <!-- Ambient Glow behind window -->
    <radialGradient id="codeAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#5865F2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Window Drop Shadow -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="800" height="450" fill="url(#editorBgGrad)" />
  <circle cx="400" cy="225" r="320" fill="url(#codeAura)" />

  <!-- Code Editor Frame -->
  <g transform="translate(40, 30)" filter="url(#shadowFilter)">
    <!-- Window Outer Shell -->
    <rect width="720" height="390" rx="14" fill="#181A26" stroke="#2B2D3F" stroke-width="1.5" />

    <!-- Window Title Bar -->
    <rect width="720" height="42" rx="14" fill="#12131D" />
    <!-- Fix bottom corner radius of titlebar -->
    <rect y="20" width="720" height="22" fill="#12131D" />
    <line x1="0" y1="42" x2="720" y2="42" stroke="#2B2D3F" stroke-width="1" />

    <!-- Window Control Buttons (macOS style) -->
    <circle cx="24" cy="21" r="6" fill="#FF5F56" />
    <circle cx="44" cy="21" r="6" fill="#FFBD2E" />
    <circle cx="64" cy="21" r="6" fill="#27C93F" />

    <!-- Editor Tab -->
    <g transform="translate(95, 8)">
      <rect width="160" height="34" rx="6" fill="#181A26" stroke="#2B2D3F" stroke-width="1" />
      <rect y="24" width="160" height="10" fill="#181A26" />
      <!-- Java Icon representation -->
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#F87171">☕</text>
      <text x="32" y="22" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="12" font-weight="600" fill="#E2E8F0">FimooCore.java</text>
    </g>

    <!-- Editor Body (Gutter + Code Area) -->
    <g transform="translate(0, 43)">
      <!-- Line Numbers Gutter -->
      <rect width="52" height="346" fill="#141520" />
      <line x1="52" y1="0" x2="52" y2="346" stroke="#232536" stroke-width="1" />

      <!-- Line Numbers -->
      <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#4B5563" text-anchor="end">
        <text x="38" y="32">3</text>
        <text x="38" y="54">4</text>
        <text x="38" y="76">5</text>
        <text x="38" y="98">6</text>
        <text x="38" y="120">7</text>
        <text x="38" y="142">8</text>
        <text x="38" y="164">9</text>
        <text x="38" y="186">10</text>
        <text x="38" y="208">11</text>
        <text x="38" y="230">12</text>
        <text x="38" y="252">13</text>
        <text x="38" y="274">14</text>
        <text x="38" y="296">15</text>
        <text x="38" y="318">16</text>
      </g>

      <!-- Active Line Highlight (Line 8 - class FimooCore) -->
      <rect x="53" y="127" width="665" height="22" fill="#8B5CF6" fill-opacity="0.08" />

      <!-- Code Syntax Highlighted Text -->
      <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="13.5" xml:space="preserve">
        
        <!-- Line 3: import org.bukkit.ChatColor; -->
        <text y="32" x="72">
          <tspan fill="#C678DD">import</tspan> <tspan fill="#61AFEF">org.bukkit.ChatColor</tspan><tspan fill="#ABB2BF">;</tspan>
        </text>

        <!-- Line 4: import org.bukkit.command.Command; -->
        <text y="54" x="72">
          <tspan fill="#C678DD">import</tspan> <tspan fill="#61AFEF">org.bukkit.command.Command</tspan><tspan fill="#ABB2BF">;</tspan>
        </text>

        <!-- Line 5: import org.bukkit.command.CommandSender; -->
        <text y="76" x="72">
          <tspan fill="#C678DD">import</tspan> <tspan fill="#61AFEF">org.bukkit.command.CommandSender</tspan><tspan fill="#ABB2BF">;</tspan>
        </text>

        <!-- Line 6: import org.bukkit.plugin.java.JavaPlugin; -->
        <text y="98" x="72">
          <tspan fill="#C678DD">import</tspan> <tspan fill="#61AFEF">org.bukkit.plugin.java.JavaPlugin</tspan><tspan fill="#ABB2BF">;</tspan>
        </text>

        <!-- Line 8: public class FimooCore extends JavaPlugin { -->
        <text y="142" x="72">
          <tspan fill="#C678DD" font-weight="700">public class</tspan> <tspan fill="#E5C07B" font-weight="700">FimooCore</tspan> <tspan fill="#C678DD" font-weight="700">extends</tspan> <tspan fill="#E5C07B">JavaPlugin</tspan> <tspan fill="#ABB2BF">{</tspan>
        </text>

        <!-- Line 10: @Override -->
        <text y="186" x="104">
          <tspan fill="#E5C07B">@Override</tspan>
        </text>

        <!-- Line 11: public void onEnable() { -->
        <text y="208" x="104">
          <tspan fill="#C678DD">public void</tspan> <tspan fill="#61AFEF" font-weight="600">onEnable</tspan><tspan fill="#ABB2BF">() {</tspan>
        </text>

        <!-- Line 12: getLogger().info("FimooCore berhasil diaktifkan!"); -->
        <text y="230" x="136">
          <tspan fill="#61AFEF">getLogger</tspan><tspan fill="#ABB2BF">().</tspan><tspan fill="#61AFEF">info</tspan><tspan fill="#ABB2BF">(</tspan><tspan fill="#98C379">"FimooCore berhasil diaktifkan!"</tspan><tspan fill="#ABB2BF">);</tspan>
        </text>

        <!-- Line 13: } -->
        <text y="252" x="104">
          <tspan fill="#ABB2BF">}</tspan>
        </text>

        <!-- Line 15: @Override -->
        <text y="296" x="104">
          <tspan fill="#E5C07B">@Override</tspan>
        </text>

        <!-- Line 16: public void onDisable() { -->
        <text y="318" x="104">
          <tspan fill="#C678DD">public void</tspan> <tspan fill="#61AFEF" font-weight="600">onDisable</tspan><tspan fill="#ABB2BF">() {</tspan>
        </text>

        <!-- Line 17: getLogger().info("FimooCore telah dimatikan."); -->
        <text y="340" x="136">
          <tspan fill="#61AFEF">getLogger</tspan><tspan fill="#ABB2BF">().</tspan><tspan fill="#61AFEF">info</tspan><tspan fill="#ABB2BF">(</tspan><tspan fill="#98C379">"FimooCore telah dimatikan."</tspan><tspan fill="#ABB2BF">);</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>

