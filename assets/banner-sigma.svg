<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sigmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="50%" stop-color="#1E0E38" />
      <stop offset="100%" stop-color="#090314" />
    </linearGradient>
    <radialGradient id="sigmaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sigmaGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sigmaBg)" />

  <g opacity="0.15">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#FDE047" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#FDE047" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <circle cx="400" cy="220" r="280" fill="url(#sigmaAura)" />

  <!-- Grand Fantasy Castle & Multi-Plugin Core -->
  <g transform="translate(400, 310)">
    <!-- Base Platform (Gold & Obsidian Tier) -->
    <polygon points="0,85 250,0 0,-85 -250,0" fill="#2E1065" stroke="#FDE047" stroke-width="2" />
    <polygon points="-250,0 0,85 0,135 -250,50" fill="#14072B" />
    <polygon points="0,85 250,0 250,50 0,135" fill="#1C0B3B" />

    <!-- Castle Citadel Structure -->
    <g transform="translate(0, -70)">
      <polygon points="-65,-20 65,-20 65,70 -65,70" fill="#1E1B4B" stroke="#4C1D95" stroke-width="2" />
      <!-- Gold & Purple Crown Spire -->
      <polygon points="0,-95 40,-20 -40,-20" fill="#7C3AED" stroke="#FDE047" stroke-width="2" />
      <!-- Golden Crown Symbol -->
      <polygon points="0,-105 10,-95 -10,-95" fill="#FDE047" />
    </g>

    <!-- Side Towers with Royal Flags -->
    <g transform="translate(-140, -50)">
      <rect x="-20" y="-60" width="40" height="80" rx="3" fill="#1E1B4B" stroke="#4C1D95" stroke-width="1.5" />
      <polygon points="0,-95 24,-60 -24,-60" fill="#F59E0B" stroke="#FDE047" stroke-width="1.5" />
    </g>
    <g transform="translate(140, -50)">
      <rect x="-20" y="-60" width="40" height="80" rx="3" fill="#1E1B4B" stroke="#4C1D95" stroke-width="1.5" />
      <polygon points="0,-95 24,-60 -24,-60" fill="#F59E0B" stroke="#FDE047" stroke-width="1.5" />
    </g>

    <!-- Beacon Broadcast Wave in Center -->
    <g transform="translate(0, -20)">
      <circle cx="0" cy="0" r="14" fill="#FDE047" opacity="0.9" />
      <circle cx="0" cy="0" r="28" stroke="#FDE047" stroke-width="2" fill="none" opacity="0.6" />
    </g>
  </g>

  <!-- Big 3D Typography Title -->
  <g transform="translate(400, 75)" text-anchor="middle">
    <text x="0" y="5" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="#000000" opacity="0.8">
      PAKET SIGMA FIMOO
    </text>
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="url(#sigmaGold)" stroke="#451A03" stroke-width="3">
      PAKET SIGMA FIMOO
    </text>

    <!-- Subtitle Banner Tag -->
    <rect x="-190" y="18" width="380" height="30" rx="15" fill="#1E1B4B" stroke="#FDE047" stroke-width="1.5" />
    <text x="0" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="2" fill="#FEF08A">
      BEST SELLER: SETUP + 15 PLUGINS + PROMOSI
    </text>
  </g>

  <!-- Floating Feature Badges -->
  <g transform="translate(40, 390)">
    <rect width="180" height="36" rx="8" fill="#181926" stroke="#FDE047" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#FDE047" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Instalasi Max 15 Plugin</text>
  </g>
  <g transform="translate(580, 390)">
    <rect width="180" height="36" rx="8" fill="#181926" stroke="#FDE047" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#8B5CF6" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Termasuk Jasa Promosi</text>
  </g>
</svg>
