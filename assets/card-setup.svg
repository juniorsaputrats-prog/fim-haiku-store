    <text x="12" y="98" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7ee787">✓ View Distance</text>
    <text x="12" y="114" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#7ee787">✓ Async Chunks</text>
