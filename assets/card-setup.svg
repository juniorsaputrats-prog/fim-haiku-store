  <line x1="0" y1="132" x2="420" y2="132" stroke="#1c2331" stroke-width="0.8" />
  <line x1="0" y1="176" x2="420" y2="176" stroke="#1c2331" stroke-width="0.8" />
  <line x1="84" y1="0" x2="84" y2="220" stroke="#1c2331" stroke-width="0.8" />
  <line x1="168" y1="0" x2="168" y2="220" stroke="#1c2331" stroke-width="0.8" />
  <line x1="252" y1="0" x2="252" y2="220" stroke="#1c2331" stroke-width="0.8" />
  <line x1="336" y1="0" x2="336" y2="220" stroke="#1c2331" stroke-width="0.8" />

