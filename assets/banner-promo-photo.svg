<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="promoPhotoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B2A" />
      <stop offset="50%" stop-color="#0A121E" />
      <stop offset="100%" stop-color="#04070D" />
    </linearGradient>
    <radialGradient id="blueAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="blueTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#promoPhotoBg)" />
  <circle cx="400" cy="200" r="280" fill="url(#blueAura)" />

  <g opacity="0.12">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Photo Slide Motif -->
  <g transform="translate(400, 180)">
    <rect x="-90" y="-60" width="180" height="120" rx="14" fill="#0C1524" stroke="#38BDF8" stroke-width="3" />
    <rect x="-70" y="-45" width="140" height="90" rx="8" fill="#13233A" />
    <!-- Mountains & Sun graphic -->
    <polygon points="-50,30 -10,-15 15,10 40,-5 60,30" fill="#0284C7" opacity="0.8" />
    <polygon points="-50,30 0,-25 35,5 60,30" fill="#38BDF8" opacity="0.6" />
    <circle cx="40" cy="-20" r="10" fill="#FDE047" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-210" y="-38" width="420" height="76" rx="14" fill="#06101D" stroke="#38BDF8" stroke-width="2.5" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#blueTitle)" text-anchor="middle" letter-spacing="3">JASA PROMOSI PHOTO SLIDE</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#BAE6FD" text-anchor="middle" letter-spacing="2">TIKTOK &amp; INSTAGRAM CAROUSEL HD 2K</text>
  </g>
</svg>

