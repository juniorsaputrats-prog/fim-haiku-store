<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="promoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#181923" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beaconBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="12" fill="#14151D" />
  <circle cx="200" cy="120" r="100" fill="url(#promoGlow)" />

  <!-- Minecraft Beacon Beam & Player Traffic Boost -->
  <g transform="translate(200, 130)">
    <!-- Pyramid Base (Iron / Diamond Blocks) -->
    <polygon points="0,50 90,15 0,-20 -90,15" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <polygon points="-90,15 0,50 0,65 -90,30" fill="#0F172A" />
    <polygon points="0,50 90,15 90,30 0,65" fill="#1E293B" />

    <!-- Glass Beacon Block -->
    <g transform="translate(0, -10)">
      <polygon points="0,-15 28,-2 0,11 -28,-2" fill="#38BDF8" opacity="0.6" stroke="#7DD3FC" stroke-width="1.5" />
      <polygon points="-28,-2 0,11 0,32 -28,19" fill="#0284C7" opacity="0.7" />
      <polygon points="0,11 28,-2 28,19 0,32" fill="#0369A1" opacity="0.7" />
      <!-- Nether Star Center -->
      <polygon points="0,2 6,8 0,14 -6,8" fill="#FDE047" />
    </g>

    <!-- Upward Beacon Skybeam -->
    <path d="M-12 -22 L-22 -140 L22 -140 L12 -22 Z" fill="url(#beaconBeam)" />
    <line x1="0" y1="-22" x2="0" y2="-140" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />

    <!-- Broadcast Waves / Player Expansion Signal -->
    <path d="M-40 -40 A45 45 0 0 1 -40 -100" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M-60 -30 A75 75 0 0 1 -60 -110" stroke="#818CF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M40 -40 A45 45 0 0 0 40 -100" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M60 -30 A75 75 0 0 0 60 -110" stroke="#818CF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Floating Badge: Community Traffic -->
    <g transform="translate(0, 48)">
      <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#181923" stroke="#5865F2" stroke-width="1.2" />
      <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5" fill="#93C5FD" text-anchor="middle">
        AUDIENCE &amp; TRAFFIC
      </text>
    </g>
  </g>

  <!-- Celebratory Sparks -->
  <circle cx="90" cy="65" r="2" fill="#38BDF8" />
  <circle cx="310" cy="55" r="2.5" fill="#818CF8" />
  <circle cx="280" cy="165" r="1.5" fill="#C084FC" />
</svg>