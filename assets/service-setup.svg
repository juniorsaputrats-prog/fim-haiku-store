<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="setupGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#181923" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="portalFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#0F0826" />
    </linearGradient>
    <linearGradient id="portalCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="12" fill="#14151D" />
  <circle cx="200" cy="120" r="100" fill="url(#setupGlow)" />

  <!-- Minecraft Spawn Hub Portal & Engine Illustration -->
  <g transform="translate(200, 120)">
    <!-- Base Platform Block -->
    <polygon points="0,55 110,15 0,-25 -110,15" fill="#1F2937" stroke="#374151" stroke-width="1.5" />
    <polygon points="-110,15 0,55 0,75 -110,35" fill="#111827" />
    <polygon points="0,55 110,15 110,35 0,75" fill="#1E293B" />

    <!-- Stone Brick Inlays -->
    <polygon points="-50,5 0,25 0,40 -50,20" fill="#374151" />
    <polygon points="0,25 50,5 50,20 0,40" fill="#4B5563" />

    <!-- Center Obsidian Portal Structure -->
    <g transform="translate(0, -35)">
      <!-- Outer Obsidian Blocks -->
      <rect x="-42" y="-55" width="84" height="90" rx="4" fill="url(#portalFrame)" stroke="#581C87" stroke-width="2" />
      <!-- Swirling Purple Gateway -->
      <rect x="-30" y="-45" width="60" height="72" rx="3" fill="url(#portalCore)" />
      <!-- Energy Glyphs -->
      <circle cx="-10" cy="-10" r="10" fill="#E9D5FF" opacity="0.6" />
      <circle cx="12" cy="5" r="7" fill="#DDD6FE" opacity="0.7" />
    </g>

    <!-- Side Pillars with Torches -->
    <g transform="translate(-75, -20)">
      <rect x="-8" y="-30" width="16" height="50" rx="2" fill="#334155" stroke="#475569" stroke-width="1.2" />
      <!-- Soul Fire / Purple Torch -->
      <rect x="-4" y="-38" width="8" height="8" rx="2" fill="#C084FC" />
      <circle cx="0" cy="-34" r="5" fill="#A855F7" opacity="0.5" />
    </g>

    <g transform="translate(75, -20)">
      <rect x="-8" y="-30" width="16" height="50" rx="2" fill="#334155" stroke="#475569" stroke-width="1.2" />
      <rect x="-4" y="-38" width="8" height="8" rx="2" fill="#C084FC" />
      <circle cx="0" cy="-34" r="5" fill="#A855F7" opacity="0.5" />
    </g>

    <!-- Floating Badge: Core Config -->
    <g transform="translate(0, 48)">
      <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#181923" stroke="#8B5CF6" stroke-width="1.2" />
      <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9.5" fill="#E9D5FF" text-anchor="middle">
        HUB &amp; ENGINE CONFIG
      </text>
    </g>
  </g>

  <!-- Ambient Stars -->
  <circle cx="65" cy="50" r="1.5" fill="#A78BFA" opacity="0.8" />
  <circle cx="335" cy="60" r="2" fill="#C084FC" opacity="0.8" />
</svg>