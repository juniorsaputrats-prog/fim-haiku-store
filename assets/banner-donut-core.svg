<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dCoreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="50%" stop-color="#0E101D" />
      <stop offset="100%" stop-color="#07080E" />
    </linearGradient>
    <radialGradient id="dGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="80%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dCoreBg)" />
  <circle cx="400" cy="200" r="280" fill="url(#dGlow)" />

  <g opacity="0.15">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Big 3D Donut Icon -->
  <g transform="translate(400, 170)">
    <circle cx="0" cy="0" r="90" fill="#F59E0B" stroke="#B45309" stroke-width="8" />
    <circle cx="0" cy="0" r="80" fill="#38BDF8" />
    <circle cx="0" cy="0" r="32" fill="#0E101D" stroke="#0284C7" stroke-width="6" />
    <!-- Frosting shine -->
    <path d="M-50,-50 C-20,-75 20,-75 50,-50 C30,-30 -30,-30 -50,-50 Z" fill="#FFFFFF" opacity="0.45" />
    <!-- Sprinkles -->
    <rect x="-40" y="20" width="14" height="6" rx="3" fill="#F43F5E" transform="rotate(25 -40 20)" />
    <rect x="30" y="30" width="14" height="6" rx="3" fill="#FBBF24" transform="rotate(-35 30 30)" />
    <rect x="40" y="-30" width="14" height="6" rx="3" fill="#34D399" transform="rotate(15 40 -30)" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-210" y="-38" width="420" height="76" rx="14" fill="#0C0D17" stroke="#38BDF8" stroke-width="2.5" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#F0F9FF" text-anchor="middle" letter-spacing="3">DONUT SMP CORE</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="url(#goldTitle)" text-anchor="middle" letter-spacing="2">THE ULTIMATE REPLICA - 450+ FEATURES</text>
  </g>
</svg>

