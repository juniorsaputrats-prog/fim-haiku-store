<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281105" />
      <stop offset="50%" stop-color="#180A03" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>
    <radialGradient id="fireAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fireTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#hcBg)" />
  <circle cx="400" cy="200" r="260" fill="url(#fireAura)" />

  <g opacity="0.12">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800" stroke="#F97316" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#F97316" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Hardcore Heart with Demon Wings/Horns -->
  <g transform="translate(400, 180)">
    <!-- Demon Wings (Stylized Pixel) -->
    <path d="M-60,-20 L-140,-80 L-100,-10 L-160,20 L-80,40 Z" fill="#9A3412" opacity="0.8" />
    <path d="M60,-20 L140,-80 L100,-10 L160,20 L80,40 Z" fill="#9A3412" opacity="0.8" />
    <!-- Heart Base -->
    <path d="M-80,-40 C-80,-85 -20,-85 0,-30 C20,-85 80,-85 80,-40 C80,25 0,85 0,85 C0,85 -80,25 -80,-40 Z" fill="#EA580C" stroke="#7C2D12" stroke-width="6" />
    <!-- Horns -->
    <polygon points="-40,-60 -55,-105 -25,-70" fill="#FBBF24" />
    <polygon points="40,-60 55,-105 25,-70" fill="#FBBF24" />
    <!-- Skull Face on Heart -->
    <rect x="-24" y="-15" width="16" height="20" rx="3" fill="#0F0502" />
    <rect x="8" y="-15" width="16" height="20" rx="3" fill="#0F0502" />
    <polygon points="-6,15 6,15 0,5" fill="#0F0502" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-190" y="-36" width="380" height="72" rx="14" fill="#130702" stroke="#F97316" stroke-width="2.5" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#fireTitle)" text-anchor="middle" letter-spacing="3">HARDCORE SMP</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FB923C" text-anchor="middle" letter-spacing="2">SPECTATOR &amp; DEATH BAN SYSTEM</text>
  </g>
</svg>

