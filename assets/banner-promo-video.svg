<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="promoVidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A2A" />
      <stop offset="50%" stop-color="#0E051D" />
      <stop offset="100%" stop-color="#06020D" />
    </linearGradient>
    <radialGradient id="camAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="promoTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#promoVidBg)" />
  <circle cx="400" cy="200" r="280" fill="url(#camAura)" />

  <g opacity="0.12">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800" stroke="#C084FC" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#C084FC" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Video Camera / Cinema Clapper Icon Motif -->
  <g transform="translate(400, 180)">
    <rect x="-80" y="-55" width="160" height="110" rx="16" fill="#1C1033" stroke="#8B5CF6" stroke-width="4" />
    <!-- Lens / Play button circle -->
    <circle cx="0" cy="0" r="32" fill="#8B5CF6" />
    <polygon points="-8,-14 16,0 -8,14" fill="#FFFFFF" />
    <!-- Clapper top bars -->
    <path d="M-80,-55 L-60,-85 L80,-85 L60,-55 Z" fill="#2E1065" stroke="#8B5CF6" stroke-width="3" />
    <polygon points="-50,-85 -40,-85 -20,-55 -30,-55" fill="#FFFFFF" />
    <polygon points="-10,-85 0,-85 20,-55 10,-55" fill="#FFFFFF" />
    <polygon points="30,-85 40,-85 60,-55 50,-55" fill="#FFFFFF" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-210" y="-38" width="420" height="76" rx="14" fill="#0E051D" stroke="#A855F7" stroke-width="2.5" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#promoTitle)" text-anchor="middle" letter-spacing="3">PROMOSI VIDEO TIKTOK</text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#E9D5FF" text-anchor="middle" letter-spacing="2">TIKTOK &amp; REELS CINEMATIC SHOWCASE</text>
  </g>
</svg>

