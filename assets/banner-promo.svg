<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="promoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#140B26" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <radialGradient id="promoAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="blueText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="beaconBeamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#promoBg)" />

  <!-- Subtle Pixel Grid -->
  <g opacity="0.15">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#5865F2" stroke-width="1" stroke-dasharray="4 8" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#5865F2" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <circle cx="400" cy="220" r="280" fill="url(#promoAura)" />

  <!-- Minecraft Beacon Pyramid & Player Crowd Scene -->
  <g transform="translate(400, 310)">
    <!-- Pyramid Base (Diamond / Lapis Block Tier) -->
    <polygon points="0,85 240,0 0,-85 -240,0" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2" />
    <polygon points="-240,0 0,85 0,135 -240,50" fill="#082F49" />
    <polygon points="0,85 240,0 240,50 0,135" fill="#075985" />

    <!-- Glass Beacon Block at Center -->
    <g transform="translate(0, -35)">
      <polygon points="0,-30 45, -5 0,20 -45,-5" fill="#38BDF8" opacity="0.7" stroke="#BAE6FD" stroke-width="2" />
      <polygon points="-45,-5 0,20 0,60 -45,35" fill="#0284C7" opacity="0.8" />
      <polygon points="0,20 45,-5 45,35 0,60" fill="#0369A1" opacity="0.8" />
      <!-- Nether Star -->
      <polygon points="0,5 12,17 0,29 -12,17" fill="#FDE047" />
    </g>

    <!-- Upward Skybeam Projecting Light -->
    <path d="M-22 -45 L-38 -280 L38 -280 L22 -45 Z" fill="url(#beaconBeamGrad)" />
    <line x1="0" y1="-45" x2="0" y2="-280" stroke="#FFFFFF" stroke-width="3" opacity="0.85" />

    <!-- Broadcast Soundwaves Expanding -->
    <path d="M-70 -70 A80 80 0 0 1 -70 -190" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M-105 -50 A130 130 0 0 1 -105 -210" stroke="#818CF8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M70 -70 A80 80 0 0 0 70 -190" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M105 -50 A130 130 0 0 0 105 -210" stroke="#818CF8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Player Avatars Celebrating on Base -->
    <g transform="translate(-140, 10)">
      <!-- Steve Style Character -->
      <rect x="-12" y="-36" width="24" height="24" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
      <rect x="-8" y="-56" width="16" height="18" fill="#FBBF24" />
    </g>
    <g transform="translate(140, 10)">
      <!-- Alex Style Character -->
      <rect x="-12" y="-36" width="24" height="24" fill="#10B981" stroke="#34D399" stroke-width="1.5" />
      <rect x="-8" y="-56" width="16" height="18" fill="#F59E0B" />
    </g>
  </g>

  <!-- Big 3D Typography Title -->
  <g transform="translate(400, 75)" text-anchor="middle">
    <text x="0" y="5" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="#000000" opacity="0.8">
      JASA PROMOSI SERVER
    </text>
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="url(#blueText)" stroke="#1E1B4B" stroke-width="3">
      JASA PROMOSI SERVER
    </text>

    <!-- Subtitle Banner Tag -->
    <rect x="-180" y="18" width="360" height="30" rx="15" fill="#1E1B4B" stroke="#5865F2" stroke-width="1.5" />
    <text x="0" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#BFDBFE">
      TRAFFIC &amp; COMMUNITY BOOST
    </text>
  </g>

  <!-- Floating Feature Badges -->
  <g transform="translate(40, 390)">
    <rect width="180" height="36" rx="8" fill="#181926" stroke="#5865F2" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#38BDF8" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Discord Gaming Broadcast</text>
  </g>
  <g transform="translate(580, 390)">
    <rect width="180" height="36" rx="8" fill="#181926" stroke="#5865F2" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#818CF8" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Active Player Growth</text>
  </g>
</svg>
